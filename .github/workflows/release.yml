name: Android Release Candidate

on:
  push:
    tags:
      - "v*"

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - run: ./gradlew clean test lint assembleDebug
      - name: Checksums
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: datum-point-release-candidate
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256SUMS.txt
